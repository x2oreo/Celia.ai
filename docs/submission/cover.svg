<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Colours follow docs/design/DESIGN.md tokens. -->
  <rect width="1600" height="900" fill="#F8F5F2"/>
  <circle cx="1240" cy="450" r="430" fill="#FDECEC"/>

  <!-- Wordmark -->
  <rect x="96" y="104" width="56" height="56" rx="16" fill="#E5484D"/>
  <path d="M124 147 L109.5 132.5 A8.5 8.5 0 0 1 124 122 A8.5 8.5 0 0 1 138.5 132.5 Z" fill="#FFFFFF"/>
  <text x="168" y="143" font-size="30" font-weight="800" fill="#1F1A17">Celia.ai</text>

  <!-- Headline -->
  <text x="96" y="318" font-size="64" font-weight="800" fill="#1F1A17" letter-spacing="-1">The heart-safety agent</text>
  <text x="96" y="394" font-size="64" font-weight="800" fill="#1F1A17" letter-spacing="-1">for <tspan fill="#C7353A">Long QT syndrome</tspan></text>

  <text x="96" y="458" font-size="24" font-weight="500" fill="#6B625C">Checks every medicine before you take it, watches your heart</text>
  <text x="96" y="492" font-size="24" font-weight="500" fill="#6B625C">through your watch, and takes over in an emergency.</text>

  <!-- Feature chips -->
  <g font-size="16" font-weight="700" fill="#1F1A17">
    <rect x="96" y="548" width="182" height="44" rx="22" fill="#FFFFFF" stroke="#D9D1CA"/>
    <circle cx="120" cy="570" r="6" fill="#E5484D"/>
    <text x="136" y="576">Medicine check</text>

    <rect x="290" y="548" width="158" height="44" rx="22" fill="#FFFFFF" stroke="#D9D1CA"/>
    <circle cx="314" cy="570" r="6" fill="#E5484D"/>
    <text x="330" y="576">Watch guard</text>

    <rect x="460" y="548" width="182" height="44" rx="22" fill="#FFFFFF" stroke="#D9D1CA"/>
    <circle cx="484" cy="570" r="6" fill="#E5484D"/>
    <text x="500" y="576">Emergency SOS</text>

    <rect x="654" y="548" width="184" height="44" rx="22" fill="#FFFFFF" stroke="#D9D1CA"/>
    <circle cx="678" cy="570" r="6" fill="#E5484D"/>
    <text x="694" y="576">On-device data</text>
  </g>

  <!-- Problem line -->
  <rect x="96" y="652" width="4" height="56" rx="2" fill="#E5484D"/>
  <text x="116" y="675" font-size="19" font-weight="700" fill="#3D3530">About 1 in 2,000 people live with Long QT syndrome.</text>
  <text x="116" y="702" font-size="19" font-weight="500" fill="#6B625C">Hundreds of everyday medicines can trigger a fatal arrhythmia.</text>

  <!-- Footer -->
  <text x="96" y="800" font-family="Menlo, Monaco, monospace" font-size="14" font-weight="700" fill="#8A817B" letter-spacing="1.2">HARMONYOS · API 20 · ARKTS + ARKUI</text>
  <text x="96" y="824" font-family="Menlo, Monaco, monospace" font-size="14" fill="#8A817B" letter-spacing="1.2">HACKYEAH 2026 × HUAWEI · IMAGINE WHAT'S NEXT</text>

  <!-- Phone -->
  <rect x="1030" y="110" width="330" height="680" rx="50" fill="#1F1A17"/>
  <rect x="1040" y="120" width="310" height="660" rx="41" fill="#F8F5F2"/>
  <text x="1058" y="172" font-size="20" font-weight="700" fill="#1F1A17">Good afternoon, Ola</text>

  <rect x="1178" y="196" width="154" height="40" rx="20" fill="#1F1A17"/>
  <text x="1255" y="221" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Can I take Klacid?</text>

  <!-- Verdict card -->
  <rect x="1058" y="254" width="274" height="252" rx="20" fill="#FFFFFF" stroke="#F4B5AF"/>
  <rect x="1072" y="270" width="146" height="32" rx="16" fill="#FEE4E2"/>
  <polygon points="1103.1,290.6 1096.6,297.1 1087.4,297.1 1080.9,290.6 1080.9,281.4 1087.4,274.9 1096.6,274.9 1103.1,281.4" fill="#D92D20"/>
  <path d="M1087.5 281.5 L1096.5 290.5 M1096.5 281.5 L1087.5 290.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <text x="1112" y="291" font-size="13" font-weight="800" fill="#B42318" letter-spacing="0.4">KNOWN RISK</text>
  <text x="1072" y="334" font-size="17" font-weight="700" fill="#1F1A17">Klacid → clarithromycin</text>
  <text font-size="14" font-weight="500" fill="#3D3530">
    <tspan x="1072" y="360">Known to prolong QT. Avoid it and</tspan>
    <tspan x="1072" y="380">ask your doctor about an alternative.</tspan>
  </text>
  <rect x="1072" y="402" width="246" height="42" rx="21" fill="#1F1A17"/>
  <text x="1195" y="428" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ask your doctor</text>
  <text font-size="10.5" font-weight="500" fill="#8A817B">
    <tspan x="1072" y="470">CredibleMeds-derived list</tspan>
    <tspan x="1072" y="486">Not a medical device.</tspan>
  </text>

  <!-- Voice orb -->
  <circle cx="1195" cy="640" r="92" fill="#E5484D" opacity="0.08"/>
  <circle cx="1195" cy="640" r="72" fill="#E5484D" opacity="0.14"/>
  <circle cx="1195" cy="640" r="52" fill="#E5484D"/>
  <rect x="1186" y="616" width="18" height="30" rx="9" fill="#FFFFFF"/>
  <path d="M1178 638 a17 17 0 0 0 34 0" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M1195 656 L1195 666" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <text x="1195" y="760" font-size="13" font-weight="700" fill="#6B625C" text-anchor="middle">Listening…</text>

  <!-- Watch -->
  <rect x="1395" y="478" width="90" height="80" rx="18" fill="#3D3530"/>
  <rect x="1395" y="722" width="90" height="80" rx="18" fill="#3D3530"/>
  <circle cx="1440" cy="640" r="128" fill="#1F1A17"/>
  <circle cx="1440" cy="640" r="116" fill="#000000"/>
  <circle cx="1440" cy="640" r="100" fill="none" stroke="#161616" stroke-width="10"/>
  <path d="M1440 540 A100 100 0 1 1 1353.4 690" fill="none" stroke="#12B76A" stroke-width="10" stroke-linecap="round"/>
  <text x="1440" y="596" font-size="15" font-weight="700" fill="#12B76A" text-anchor="middle">All good</text>
  <text x="1440" y="666" font-size="68" font-weight="800" fill="#FFFFFF" text-anchor="middle">72</text>
  <text x="1440" y="694" font-size="16" font-weight="500" fill="#B8AEA8" text-anchor="middle">bpm</text>
</svg>
